# Landing funkicrm.ru (personal-crm-landing repo, deploy/nginx/).
# Installed to /etc/nginx/sites-available/funkicrm-landing.conf by deploy/nginx/install.sh.
# HTTP -> HTTPS redirect and the catch-all server stay in the shared funkicrm.conf.
# server_tokens off is global: /etc/nginx/conf.d/funkicrm-hardening.conf.

server {
    listen 443 ssl http2;
    server_name funkicrm.ru;
    include snippets/funkicrm-cert.conf;
    root /var/www/funkicrm.ru;
    index index.html;

    # Security headers. "always" adds them to error pages (404) too.
    # nginx drops these for a location that has its own add_header:
    # such a location must repeat all of them.

    # HTTPS only for a year; subdomains (app, test-app) are not covered on purpose
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Own files only. Inline scripts and styles are allowed: no nonce, the page stays as is
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    # No embedding in frames (old browsers; new ones use frame-ancestors above)
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    location / { try_files $uri $uri/ =404; }
}
